[project]
name = "myquantstore"
version = "0.1.0"
description = "Historisation périodique des données OHLCV multi-instruments (futures, stocks, forex, indices, options) via Massive.com (1min) et Yahoo Finance (1day)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheoBainee" }]
keywords = ["myquantstore", "futures", "stocks", "forex", "indices", "options", "ohlcv", "massive", "parquet", "polars", "historisation", "quant"]

# Dépendances runtime — on privilégie Polars (performant, types Categorical optimisés)
# httpx pour le client HTTP sync, tenacity pour les retries avancés (Retry-After + backoff)
# pydantic-settings pour la config (.env + config.toml), rich pour les logs colorés
# argcomplete pour l'autocompletion shell (optionnelle — silencieux si shell non configuré)
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "argcomplete>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "zeroconf>=0.130",
    "tomlkit>=0.13",
    "curl_cffi>=0.6",
]

[project.optional-dependencies]
# Dépendances de développement — respx pour mocker httpx dans les tests
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# Point d'entrée CLI : `myquantstore <commande>`
# Pointe vers __main__ (qui contient le marqueur ARGCOMPLETE_OK pour l'autocompletion).
myquantstore = "myquantstore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myquantstore"]

# --- Ruff : linter + formateur ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# E501 (line too long) : désactivé — le formateur gère déjà la lisibilité via line-length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["myquantstore"]

# --- MyPy : vérification des types (strict sur src/) ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["myquantstore"]

[[tool.mypy.overrides]]
# Polars n'a pas de stubs parfaits — on désactive some checks pour ce module
module = "polars.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["myquantstore"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
