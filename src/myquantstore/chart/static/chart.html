<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyQuantStore — __PRODUCT__</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e222d; color: #d1d4dc; font-family: -apple-system, sans-serif; }
        #toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #131722; border-bottom: 1px solid #2a2e39; }
        #toolbar label { font-size: 13px; color: #787b86; }
        #toolbar select { background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45; border-radius: 4px; padding: 4px 8px; font-size: 13px; }
        #toolbar button { background: #2962ff; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
        #toolbar button:hover { background: #1e53e5; }
        #toolbar a.home-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 4px;
            background: #2a2e39; color: #d1d4dc; text-decoration: none;
            border: 1px solid #363a45; flex-shrink: 0;
        }
        #toolbar a.home-btn:hover { background: #363a45; color: #fff; border-color: #2962ff; }
        #toolbar a.home-btn svg { display: block; }
        #toolbar .info { margin-left: auto; font-size: 12px; color: #787b86; }
        #chart { width: 100%; height: calc(100vh - 50px); position: relative; }
        #chart.loading { pointer-events: none; }
        #overlay-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        /* --- Sélecteur d'overlay backtest --- */
        #overlay-picker { position: relative; display: flex; align-items: center; gap: 8px; }
        #overlay-trigger {
            display: inline-flex; align-items: center; gap: 8px; max-width: 420px;
            background: #2a2e39; color: #d1d4dc; border: 1px solid #363a45;
            border-radius: 4px; padding: 4px 8px; font-size: 13px; cursor: pointer;
        }
        #overlay-trigger:hover { border-color: #2962ff; }
        #overlay-trigger .ov-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #overlay-trigger .ov-warn { color: #FF9800; flex-shrink: 0; }
        #overlay-trigger .ov-caret { color: #787b86; flex-shrink: 0; }
        #overlay-popover {
            position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
            width: 460px; max-height: 70vh; display: flex; flex-direction: column;
            background: #131722; border: 1px solid #363a45; border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }
        #overlay-popover .ov-controls {
            padding: 8px; border-bottom: 1px solid #2a2e39;
            display: flex; flex-direction: column; gap: 8px;
        }
        #overlay-search {
            width: 100%; background: #1e222d; color: #d1d4dc; border: 1px solid #363a45;
            border-radius: 4px; padding: 6px 8px; font-size: 13px;
        }
        #overlay-search:focus { outline: none; border-color: #2962ff; }
        .ov-row { display: flex; align-items: center; gap: 8px; }
        .ov-row select { flex: 1 1 auto; min-width: 0; }
        .ov-chips { display: flex; gap: 4px; flex-shrink: 0; }
        .ov-chip {
            background: #2a2e39; color: #787b86; border: 1px solid #363a45;
            border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer;
        }
        .ov-chip:hover { color: #d1d4dc; }
        .ov-chip[aria-pressed="true"] { background: #2962ff; border-color: #2962ff; color: #fff; }
        #overlay-list { flex: 1 1 auto; overflow-y: auto; padding: 4px 0; }
        .ov-group-head {
            padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase;
            letter-spacing: .04em; color: #787b86;
        }
        .ov-group-head .ov-count { color: #4a4e5a; }
        .ov-item { display: flex; align-items: baseline; gap: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
        .ov-item:hover, .ov-item.ov-active { background: #1e222d; }
        .ov-item[aria-selected="true"] { color: #2962ff; }
        .ov-item[aria-selected="true"]::before { content: '✓'; }
        .ov-item .ov-id { margin-left: auto; font-family: monospace; font-size: 11px; color: #4a4e5a; flex-shrink: 0; }
        .ov-empty { padding: 10px; font-size: 12px; color: #787b86; }
        .ov-outside { border-top: 1px solid #2a2e39; margin-top: 4px; }
        .ov-outside > summary {
            padding: 6px 10px; font-size: 11px; text-transform: uppercase;
            letter-spacing: .04em; color: #787b86; cursor: pointer;
        }
        .ov-skipped { padding: 6px 10px; border-top: 1px solid #2a2e39; font-size: 11px; color: #FF9800; }
        #overlay-tooltip {
            position: fixed; z-index: 40; display: none; pointer-events: none; max-width: 340px;
            background: #131722; border: 1px solid #363a45; border-radius: 4px; padding: 8px 10px;
            font-size: 11px; font-family: monospace; color: #d1d4dc;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
        }
        #overlay-tooltip .ov-tt-head {
            margin-bottom: 6px; font-family: -apple-system, sans-serif; font-size: 12px; color: #d1d4dc;
        }
        #overlay-tooltip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
        #overlay-tooltip dt { color: #787b86; }
        #overlay-tooltip dt.ov-salient { color: #2962ff; }
        #overlay-tooltip dd { color: #d1d4dc; word-break: break-all; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #787b86; }
        #tooltip { position: absolute; z-index: 10; display: none; pointer-events: none; background: #131722; border: 1px solid #2a2e39; border-radius: 4px; padding: 8px 12px; font-size: 12px; font-family: monospace; color: #d1d4dc; white-space: nowrap; line-height: 1.6; }
        #tooltip .tt-date { color: #787b86; margin-bottom: 4px; }
        #tooltip .tt-ohlcv { display: grid; grid-template-columns: auto auto auto auto; gap: 2px 12px; }
        #tooltip .tt-label { color: #787b86; }
        #tooltip .tt-vol { grid-column: 1 / -1; margin-top: 4px; color: #787b86; }
        #tooltip .tt-delta { grid-column: 1 / -1; }
        #tooltip .up { color: #26a69a; }
        #tooltip .down { color: #ef5350; }
    </style>
</head>
<body>
    <div id="toolbar">
        <a class="home-btn" href="/" title="Dashboard" aria-label="Retour au dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5"/>
                <path d="M5 10v10h14V10"/>
            </svg>
        </a>
        <label>UT:</label>
        <select id="timescale-select">
            <option value="min:1" __SEL_1min__>1 min</option>
            <option value="min:2" __SEL_2min__>2 min</option>
            <option value="min:5" __SEL_5min__>5 min</option>
            <option value="min:10" __SEL_10min__>10 min</option>
            <option value="min:15" __SEL_15min__>15 min</option>
            <option value="min:30" __SEL_30min__>30 min</option>
            <option value="hour:1" __SEL_1h__>1 h</option>
            <option value="hour:2" __SEL_2h__>2 h</option>
            <option value="hour:4" __SEL_4h__>4 h</option>
            <option value="day:1" __SEL_1d__>1 day</option>
            <option value="day:2" __SEL_2d__>2 day</option>
            <option value="week:1" __SEL_1w__>1 week</option>
        </select>
        <label>Échelle:</label>
        <select id="scale-select" title="Échelle de prix">
            <option value="linear">Lin</option>
            <option value="log">Log</option>
        </select>
        <button id="fit-btn">Ajuster</button>
        <div id="overlay-picker" hidden>
            <label for="overlay-trigger">Backtest:</label>
            <button id="overlay-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="ov-warn" hidden title="Hors filtre UT courant">⚠</span>
                <span class="ov-name">Aucun</span>
                <span class="ov-caret" aria-hidden="true">▾</span>
            </button>
            <div id="overlay-popover" hidden>
                <div class="ov-controls">
                    <input id="overlay-search" type="search" autocomplete="off"
                           placeholder="Rechercher — label, id, type, params…">
                    <div class="ov-row">
                        <select id="overlay-type" title="Type de backtest"></select>
                        <div class="ov-chips" role="group" aria-label="Relation UT">
                            <button type="button" class="ov-chip" data-ut="gte"
                                    title="Backtests calculés sur une UT égale ou plus grossière que le graph">UT ≥ graph</button>
                            <button type="button" class="ov-chip" data-ut="eq"
                                    title="Backtests calculés exactement sur l'UT du graph">UT = graph</button>
                        </div>
                    </div>
                </div>
                <div id="overlay-list" role="listbox" tabindex="-1"></div>
                <div id="overlay-skipped" class="ov-skipped" hidden></div>
            </div>
            <div id="overlay-tooltip" role="tooltip"></div>
        </div>
        <span class="info" id="info-bar">Chargement...</span>
    </div>
    <div id="loading">Chargement des chandeliers...</div>
    <div id="chart">
        <canvas id="overlay-canvas"></canvas>
        <div id="tooltip"></div>
    </div>

    <script src="/static/lightweight-charts.standalone.production.js"></script>
    <script type="module">
        import * as Arrow from '/static/apache-arrow.min.js';

        // --- Paramètres injectés par le serveur ---
        const PRODUCT = "__PRODUCT__";
        const TIMESCALE_UNIT = "__TIMESCALE_UNIT__";
        const TIMESCALE_NB = parseInt("__TIMESCALE_NB__");
        const NB_CANDLE = parseInt("__NB_CANDLE__");
        const MAX_VISIBLE_CANDLES = parseInt("__MAX_VISIBLE_CANDLES__");
        const BUFFER_MULTIPLIER = parseInt("__BUFFER_MULTIPLIER__");
        const FETCH_CHUNK_SIZE = parseInt("__FETCH_CHUNK_SIZE__");
        const INTRADAY_BEGIN = __INTRADAY_BEGIN__;
        const INTRADAY_END = __INTRADAY_END__;
        const CANDLE_UP = "__CANDLE_UP__";
        const CANDLE_DOWN = "__CANDLE_DOWN__";
        const TX_BUY = "__TX_BUY__";
        const TX_SELL = "__TX_SELL__";
        const ORDER_BUY = "__ORDER_BUY__";
        const ORDER_SELL = "__ORDER_SELL__";
        const TIMEZONE = "__TIMEZONE__";

        function hexToRgba(hex, alpha) {
            let h = String(hex || '').replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const n = parseInt(h, 16);
            if (Number.isNaN(n) || h.length !== 6) return `rgba(128,128,128,${alpha})`;
            return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
        }
        const VOL_UP = hexToRgba(CANDLE_UP, 0.5);
        const VOL_DOWN = hexToRgba(CANDLE_DOWN, 0.5);

        const _fmtTzDateTime = new Intl.DateTimeFormat('en-CA', {
            timeZone: TIMEZONE,
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false,
        });
        const _fmtTzDate = new Intl.DateTimeFormat('en-CA', {
            timeZone: TIMEZONE,
            year: 'numeric', month: '2-digit', day: '2-digit',
        });
        const _fmtTzTime = new Intl.DateTimeFormat('en-GB', {
            timeZone: TIMEZONE,
            hour: '2-digit', minute: '2-digit', hour12: false,
        });
        const _fmtTzTick = new Intl.DateTimeFormat('en-GB', {
            timeZone: TIMEZONE,
            month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit', hour12: false,
        });

        function formatInTz(unixSec) {
            // en-CA → YYYY-MM-DD, HH:MM
            const parts = _fmtTzDateTime.formatToParts(new Date(unixSec * 1000));
            const get = (t) => parts.find(p => p.type === t)?.value || '';
            return `${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')} ${TIMEZONE}`;
        }
        function formatDateInTz(unixSec) {
            return _fmtTzDate.format(new Date(unixSec * 1000));
        }

        // --- État global ---
        let chart, candleSeries, volumeSeries;
        let allCandles = [];      // Toutes les candles chargées en mémoire
        let oldestTimestamp = null;  // Timestamp de la candle la plus ancienne chargée
        let isLoading = false;    // Anti-reentrancy pour le lazy loading
        let noMoreData = false;   // True quand on a atteint le début de l'historique (plus rien à fetch)
        let currentTimescale = { unit: TIMESCALE_UNIT, nb: TIMESCALE_NB };
        let overlayCatalog = { overlays: [], facets: { types: [] }, skipped: [] };
        // Sélection en tableau de clés + payloads indexés : mono aujourd'hui, prêt pour le multi.
        let selectedOverlayKeys = [];
        const overlayPayloads = new Map(); // key -> payload API
        let overlayFilters = { search: '', type: '', ut: 'gte' };
        let overlayTxParsed = [];     // {time, price, color}
        let overlayOrdersParsed = []; // {t0, t1, price, color, dashed}
        let seriesMarkersApi = null;
        let overlayCanvas = null;
        let overlayCtx = null;
        let overlayDrawRaf = 0;

        // --- Création du chart ---
        function createChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                layout: {
                    background: { type: 'solid', color: '#1e222d' },
                    textColor: '#d1d4dc',
                    attributionLogo: true,  // Attribution TradingView ( requis par la license Apache-2.0)
                    panes: { separatorColor: '#2a2e39', separatorHoverColor: 'rgba(42,46,57,0.5)', enableResize: true },
                },
                grid: {
                    vertLines: { color: '#2a2e39' },
                    horzLines: { color: '#2a2e39' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#363a45' },
                timeScale: {
                    borderColor: '#363a45',
                    timeVisible: true,
                    secondsVisible: false,
                    tickMarkFormatter: (time) => {
                        const sec = typeof time === 'number' ? time : null;
                        if (sec == null) return '';
                        return _fmtTzTick.format(new Date(sec * 1000));
                    },
                },
                localization: {
                    timeFormatter: (time) => {
                        const sec = typeof time === 'number' ? time : null;
                        if (sec == null) return '';
                        return formatInTz(sec);
                    },
                },
            });

            // Pane 0 : candlestick
            candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: CANDLE_UP, downColor: CANDLE_DOWN,
                borderVisible: false,
                wickUpColor: CANDLE_UP, wickDownColor: CANDLE_DOWN,
            });

            // Pane 1 : volume (histogram)
            volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
                priceFormat: { type: 'volume' },
                priceScaleId: 'volume',
            }, 1);
            chart.panes()[1].setHeight(120);

            // Cap de zoom : empêcher de dézoomer au-delà de MAX_VISIBLE_CANDLES
            chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
                if (range === null) return;
                const visibleCount = range.to - range.from;
                if (visibleCount > MAX_VISIBLE_CANDLES) {
                    const center = (range.from + range.to) / 2;
                    chart.timeScale().setVisibleLogicalRange({
                        from: center - MAX_VISIBLE_CANDLES / 2,
                        to: center + MAX_VISIBLE_CANDLES / 2,
                    });
                    return;
                }
                // Lazy loading : fetch seulement si proche du bord gauche (< 250 candles
                // avant la vue) et qu'il reste de l'historique à charger
                if (!noMoreData && oldestTimestamp !== null) {
                    const barsInfo = candleSeries.barsInLogicalRange(range);
                    if (barsInfo !== null && barsInfo.barsBefore < 250) {
                        fetchOlderCandles();
                    }
                }
                scheduleOverlayCanvasDraw();
            });

            overlayCanvas = document.getElementById('overlay-canvas');
            overlayCtx = overlayCanvas.getContext('2d');

            // Resize responsive
            new ResizeObserver(entries => {
                if (entries.length > 0) {
                    const { width, height } = entries[0].contentRect;
                    chart.applyOptions({ width, height });
                    resizeOverlayCanvas(width, height);
                    scheduleOverlayCanvasDraw();
                }
            }).observe(container);

            // Tooltip OHLCV au survol (crosshair)
            chart.subscribeCrosshairMove(param => {
                if (!param.time || !param.point || allCandles.length === 0) {
                    tooltipEl.style.display = 'none';
                    return;
                }
                const candle = candleMap.get(param.time);
                if (!candle) {
                    tooltipEl.style.display = 'none';
                    return;
                }

                // Date/heure lisible (timezone conf)
                const dateStr = formatInTz(candle.time);

                // Variation
                const delta = candle.close - candle.open;
                const pct = candle.open !== 0 ? (delta / candle.open * 100) : 0;
                const up = delta >= 0;
                const deltaStr = `${up ? '+' : ''}${delta.toFixed(2)} (${up ? '+' : ''}${pct.toFixed(2)}%)`;

                // Formater prix
                const fmt = v => v.toFixed(2);
                const fmtVol = v => v.toLocaleString();

                tooltipEl.innerHTML =
                    `<div class="tt-date">${dateStr}</div>` +
                    `<div class="tt-ohlcv">` +
                    `<span class="tt-label">O</span><span>${fmt(candle.open)}</span>` +
                    `<span class="tt-label">H</span><span>${fmt(candle.high)}</span>` +
                    `<span class="tt-label">L</span><span>${fmt(candle.low)}</span>` +
                    `<span class="tt-label">C</span><span>${fmt(candle.close)}</span>` +
                    `</div>` +
                    `<div class="tt-vol">Vol ${fmtVol(candle.volume)}</div>` +
                    `<div class="tt-delta ${up ? 'up' : 'down'}">Δ ${deltaStr}</div>`;

                // Positionner le tooltip près du curseur
                const containerRect = container.getBoundingClientRect();
                let x = param.point.x + 12;
                let y = param.point.y + 12;
                // Debordement droite -> gauche du curseur
                if (x + tooltipEl.offsetWidth > containerRect.width) {
                    x = param.point.x - tooltipEl.offsetWidth - 12;
                }
                // Debordement bas -> au-dessus du curseur
                if (y + tooltipEl.offsetHeight > containerRect.height) {
                    y = param.point.y - tooltipEl.offsetHeight - 12;
                }
                tooltipEl.style.left = x + 'px';
                tooltipEl.style.top = y + 'px';
                tooltipEl.style.display = 'block';
            });
        }

        /** Une barre par `time` (garde la dernière), ordre ASC présupposé. */
        function dedupeCandlesByTime(rows) {
            if (!rows.length) return rows;
            const out = [];
            for (const r of rows) {
                if (out.length && out[out.length - 1].time === r.time) {
                    out[out.length - 1] = r;
                } else {
                    out.push(r);
                }
            }
            return out;
        }

        // --- Parsing Arrow IPC → array de candles ---
        function parseArrowIpc(buffer) {
            const table = Arrow.tableFromIPC(buffer);
            const rows = [];
            const cols = table.schema.names;
            const colMap = {};
            cols.forEach((name, i) => { colMap[name] = table.getChildAt(i); });

            const n = table.numRows;
            let skipped = 0;
            for (let i = 0; i < n; i++) {
                const ws = colMap['time'] ? colMap['time'].get(i) : null;
                const o = colMap['open'] ? colMap['open'].get(i) : null;
                const h = colMap['high'] ? colMap['high'].get(i) : null;
                const l = colMap['low'] ? colMap['low'].get(i) : null;
                const c = colMap['close'] ? colMap['close'].get(i) : null;
                // Skip les candles incomplètes (Lightweight Charts rejette les null)
                if (ws === null || o === null || h === null || l === null || c === null) {
                    skipped++;
                    continue;
                }
                // Lightweight Charts attend un timestamp UNIX en secondes
                const ts = Math.floor(new Date(ws).getTime() / 1000);
                rows.push({
                    time: ts,
                    open: o,
                    high: h,
                    low: l,
                    close: c,
                    volume: colMap['volume'] ? colMap['volume'].get(i) : 0,
                });
            }
            if (skipped > 0) {
                console.warn(`[chart] ${skipped} candles skippées (valeurs null)`);
            }
            // Trier par time ascendant (Lightweight Charts l'exige)
            rows.sort((a, b) => a.time - b.time);
            return dedupeCandlesByTime(rows);
        }

        // --- Chargement initial ---
        async function loadInitial() {
            document.getElementById('chart').classList.add('loading');
            document.getElementById('loading').style.display = 'block';
            const limit = MAX_VISIBLE_CANDLES * BUFFER_MULTIPLIER;
            const url = `/api/candles?product=${PRODUCT}&timescale_unit=${currentTimescale.unit}&timescale_nb=${currentTimescale.nb}&limit=${limit}`;
            const resp = await fetch(url);
            if (!resp.ok) { document.getElementById('loading').textContent = 'Erreur: ' + resp.status; return; }
            const buffer = await resp.arrayBuffer();
            if (buffer.byteLength === 0) { document.getElementById('loading').textContent = 'Aucune donnée'; return; }

            allCandles = parseArrowIpc(buffer);
            if (allCandles.length === 0) { document.getElementById('loading').textContent = 'Aucune candle'; return; }

            oldestTimestamp = allCandles[0].time;
            noMoreData = false;
            updateChart();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('chart').classList.remove('loading');

            // Zoom initial sur les NB_CANDLE plus récentes
            const total = allCandles.length;
            const fromIdx = Math.max(0, total - NB_CANDLE);
            chart.timeScale().setVisibleLogicalRange({ from: fromIdx, to: total });

            updateInfoBar();
        }

        // --- Lazy loading : fetch des candles plus anciennes ---
        async function fetchOlderCandles() {
            if (isLoading || noMoreData || oldestTimestamp === null) return;
            isLoading = true;

            const boundary = oldestTimestamp; // API `before` inclusive (end <=) :
            // on droppe le joint côté client pour éviter un doublon de time au prepend
            // (sinon setData LWC → Uncaught Error: Value is null)
            const beforeDate = new Date(boundary * 1000).toISOString();
            const url = `/api/candles?product=${PRODUCT}&timescale_unit=${currentTimescale.unit}&timescale_nb=${currentTimescale.nb}&limit=${FETCH_CHUNK_SIZE}&before=${beforeDate}`;

            try {
                const resp = await fetch(url);
                if (!resp.ok) return;
                const buffer = await resp.arrayBuffer();
                if (buffer.byteLength === 0) {  // Plus d'historique
                    noMoreData = true;
                    logger.debug('Lazy load: plus de données historiques');
                    return;
                }

                // Exclusif : uniquement des times strictement plus anciens que le joint
                const olderCandles = parseArrowIpc(buffer).filter(c => c.time < boundary);
                if (olderCandles.length === 0) {  // Vide ou seul le joint inclusif reçu
                    noMoreData = true;
                    logger.debug('Lazy load: 0 candles nouvelles, plus de données');
                    return;
                }

                // Prepend : les candles plus anciennes vont au début (dédup au cas où)
                allCandles = dedupeCandlesByTime([...olderCandles, ...allCandles]);
                oldestTimestamp = allCandles[0].time;

                updateChart();
                updateInfoBar();
                logger.debug(`Lazy load: +${olderCandles.length} candles (total: ${allCandles.length})`);
            } catch (e) {
                console.error('Lazy load error:', e);
            } finally {
                isLoading = false;
            }
        }

        // --- Mettre à jour les données du chart ---
        function updateChart() {
            const candleData = allCandles.map(c => ({
                time: c.time, open: c.open, high: c.high, low: c.low, close: c.close,
            }));
            const volumeData = allCandles.map(c => ({
                time: c.time, value: c.volume,
                color: c.close >= c.open ? VOL_UP : VOL_DOWN,
            }));
            candleSeries.setData(candleData);
            volumeSeries.setData(volumeData);
            // Refresh le lookup map pour le tooltip crosshair
            candleMap.clear();
            for (const c of allCandles) {
                candleMap.set(c.time, c);
            }
            applyOverlayMarkers();
            scheduleOverlayCanvasDraw();
        }

        // --- Barre d'info ---
        function updateInfoBar() {
            const total = allCandles.length;
            const first = allCandles.length > 0 ? formatDateInTz(allCandles[0].time) : 'N/A';
            const last = allCandles.length > 0 ? formatDateInTz(allCandles[allCandles.length-1].time) : 'N/A';
            document.getElementById('info-bar').textContent =
                `${PRODUCT} | ${total} candles | ${first} → ${last} | ${currentTimescale.nb}${currentTimescale.unit} | ${TIMEZONE}`;
        }

        // --- Tooltip OHLCV au survol (crosshair) ---
        const tooltipEl = document.getElementById('tooltip');
        const candleMap = new Map();  // time -> candle (refreshed in updateChart)

        // --- Changement d'UT (timescale selector) ---
        async function changeTimescale(unit, nb) {
            currentTimescale = { unit, nb };
            allCandles = [];
            oldestTimestamp = null;
            noMoreData = false;
            localStorage.setItem('myquantstore-timescale', `${unit}:${nb}`);
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').textContent = 'Chargement...';
            await loadInitial();
            // Les chips UT sont relatives au graph : réévaluation du filtre après changement d'UT.
            renderOverlayList();
        }

        // --- Bouton "Ajuster" (fit content) ---
        document.getElementById('fit-btn').addEventListener('click', () => {
            const total = allCandles.length;
            const fromIdx = Math.max(0, total - NB_CANDLE);
            chart.timeScale().setVisibleLogicalRange({ from: fromIdx, to: total });
        });

        // --- Timescale selector ---
        document.getElementById('timescale-select').addEventListener('change', (e) => {
            const [unit, nb] = e.target.value.split(':');
            changeTimescale(unit, parseInt(nb));
        });

        // --- Échelle prix Lin / Log (pane candles uniquement) ---
        function applyPriceScaleMode(mode) {
            const psMode = mode === 'log'
                ? LightweightCharts.PriceScaleMode.Logarithmic
                : LightweightCharts.PriceScaleMode.Normal;
            chart.priceScale('right').applyOptions({ mode: psMode });
            localStorage.setItem('myquantstore-price-scale', mode);
        }
        document.getElementById('scale-select').addEventListener('change', (e) => {
            applyPriceScaleMode(e.target.value);
        });

        // --- Overlay backtests ---
        function toUnix(iso) {
            if (!iso) return null;
            const ms = Date.parse(iso);
            return Number.isNaN(ms) ? null : Math.floor(ms / 1000);
        }

        function barSeconds() {
            const n = currentTimescale.nb || 1;
            switch (currentTimescale.unit) {
                case 'min': return n * 60;
                case 'hour': return n * 3600;
                case 'day': return n * 86400;
                case 'week': return n * 604800;
                default: return n * 60;
            }
        }

        /** Dernière candle <= unix (dichotomie, allCandles trié). */
        function snapTime(unix) {
            const arr = allCandles;
            const n = arr.length;
            if (!n) return unix;
            if (unix <= arr[0].time) return arr[0].time;
            if (unix >= arr[n - 1].time) return arr[n - 1].time;
            let lo = 0, hi = n - 1;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (arr[mid].time <= unix) lo = mid;
                else hi = mid - 1;
            }
            return arr[lo].time;
        }

        function nextCandleTime(unix) {
            const arr = allCandles;
            const n = arr.length;
            if (!n) return unix + barSeconds();
            let lo = 0, hi = n;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (arr[mid].time <= unix) lo = mid + 1;
                else hi = mid;
            }
            return lo < n ? arr[lo].time : unix + barSeconds();
        }

        /** Segment pending [time_from, time_to] ; durée 0 → 1 chandelier. */
        function orderSegmentTimes(t0, t1) {
            if (t0 == null) return null;
            const from = snapTime(t0);
            const toRaw = t1 != null ? t1 : t0;
            let to;
            if (toRaw <= t0) {
                to = nextCandleTime(from);
            } else {
                to = snapTime(toRaw);
                if (to <= from) to = nextCandleTime(from);
            }
            return { from, to };
        }

        /** Couleurs d'un overlay sélectionné. Mono : conf. Multi : palette par index. */
        function overlayColors(index) {
            return { txBuy: TX_BUY, txSell: TX_SELL, orderBuy: ORDER_BUY, orderSell: ORDER_SELL };
        }

        /** Aplatit les payloads sélectionnés en listes de rendu (itère sur N overlays). */
        function parseOverlayPayloads() {
            overlayTxParsed = [];
            overlayOrdersParsed = [];
            let index = 0;
            for (const key of selectedOverlayKeys) {
                const payload = overlayPayloads.get(key);
                if (!payload) continue;
                const colors = overlayColors(index++);
                for (const t of (payload.transactions || [])) {
                    const time = toUnix(t.time);
                    if (time == null || t.price == null) continue;
                    overlayTxParsed.push({
                        time,
                        price: t.price,
                        color: t.side === 'buy' ? colors.txBuy : colors.txSell,
                    });
                }
                for (const o of (payload.orders || [])) {
                    if (o.order_type === 'MKT' || o.price == null) continue;
                    const t0 = toUnix(o.time_from);
                    if (t0 == null) continue;
                    const t1 = toUnix(o.time_to);
                    overlayOrdersParsed.push({
                        t0,
                        t1: t1 != null ? t1 : t0,
                        price: o.price,
                        color: o.side === 'buy' ? colors.orderBuy : colors.orderSell,
                        dashed: o.order_type === 'STP',
                    });
                }
            }
            overlayTxParsed.sort((a, b) => a.time - b.time);
            // Tri par t0 pour parcours viewport O(k) au lieu de O(n)
            overlayOrdersParsed.sort((a, b) => a.t0 - b.t0 || a.t1 - b.t1);
        }

        /** Premier index avec t1 >= t (ordres triés par t0 ; approx utile). */
        function firstOrderIndexPossiblyVisible(visFrom) {
            const arr = overlayOrdersParsed;
            // t0 croissant : on peut sauter ceux avec t1 < visFrom seulement en scan;
            // borne basse sûre = premier t0 qui pourrait encore chevaucher si t1 long.
            // Scan linéaire court grâce au break sur t0 > visTo côté caller.
            let i = 0;
            // Avance grossière : tant que t0+maxSpan < visFrom… sans maxSpan, skip t1 < visFrom
            while (i < arr.length && arr[i].t1 < visFrom) i++;
            return i;
        }

        function clearOverlayDrawings() {
            overlayTxParsed = [];
            overlayOrdersParsed = [];
            if (seriesMarkersApi) seriesMarkersApi.setMarkers([]);
            if (overlayCtx && overlayCanvas) {
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            }
        }

        function resizeOverlayCanvas(cssW, cssH) {
            if (!overlayCanvas || !overlayCtx) return;
            const dpr = window.devicePixelRatio || 1;
            const w = Math.max(1, Math.floor(cssW * dpr));
            const h = Math.max(1, Math.floor(cssH * dpr));
            if (overlayCanvas.width !== w || overlayCanvas.height !== h) {
                overlayCanvas.width = w;
                overlayCanvas.height = h;
            }
            overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function scheduleOverlayCanvasDraw() {
            if (overlayDrawRaf) return;
            overlayDrawRaf = requestAnimationFrame(() => {
                overlayDrawRaf = 0;
                drawOverlayOrdersCanvas();
            });
        }

        function drawOverlayOrdersCanvas() {
            if (!overlayCtx || !overlayCanvas || !chart || !candleSeries) return;
            const cssW = overlayCanvas.clientWidth;
            const cssH = overlayCanvas.clientHeight;
            if (cssW <= 0 || cssH <= 0) return;
            resizeOverlayCanvas(cssW, cssH);
            overlayCtx.clearRect(0, 0, cssW, cssH);
            if (!overlayOrdersParsed.length) return;

            const range = chart.timeScale().getVisibleRange();
            const visFrom = range ? range.from : null;
            const visTo = range ? range.to : null;

            // Clip au pane candles (évite de dessiner sur le volume)
            let paneH = cssH;
            try {
                const panes = chart.panes && chart.panes();
                if (panes && panes.length && typeof panes[0].getHeight === 'function') {
                    paneH = panes[0].getHeight();
                }
            } catch (_) { /* fallback full height */ }

            overlayCtx.save();
            overlayCtx.beginPath();
            overlayCtx.rect(0, 0, cssW, paneH);
            overlayCtx.clip();
            overlayCtx.lineWidth = 1;
            overlayCtx.lineCap = 'butt';

            const ts = chart.timeScale();
            const start = (visFrom != null) ? firstOrderIndexPossiblyVisible(visFrom) : 0;
            for (let i = start; i < overlayOrdersParsed.length; i++) {
                const o = overlayOrdersParsed[i];
                if (visTo != null && o.t0 > visTo) break;
                if (visFrom != null && o.t1 < visFrom) continue;
                const seg = orderSegmentTimes(o.t0, o.t1);
                if (!seg) continue;
                let x0 = ts.timeToCoordinate(seg.from);
                let x1 = ts.timeToCoordinate(seg.to);
                const y = candleSeries.priceToCoordinate(o.price);
                if (y == null || y < 0 || y > paneH) continue;
                // Segment partiellement hors vue : clamp sur le bord canvas
                if (x0 == null && x1 == null) continue;
                if (x0 == null) x0 = seg.from < (visFrom ?? seg.from) ? 0 : cssW;
                if (x1 == null) x1 = seg.to > (visTo ?? seg.to) ? cssW : 0;
                if (x0 === x1) continue;

                overlayCtx.strokeStyle = o.color;
                overlayCtx.setLineDash(o.dashed ? [5, 4] : []);
                overlayCtx.beginPath();
                overlayCtx.moveTo(x0, y);
                overlayCtx.lineTo(x1, y);
                overlayCtx.stroke();
            }
            overlayCtx.restore();
        }

        /** Markers au load / update candles — pas à chaque pan. */
        function applyOverlayMarkers() {
            if (!candleSeries) return;
            if (!seriesMarkersApi && LightweightCharts.createSeriesMarkers) {
                seriesMarkersApi = LightweightCharts.createSeriesMarkers(candleSeries, []);
            }
            if (!seriesMarkersApi) return;
            if (!overlayTxParsed.length || !allCandles.length) {
                seriesMarkersApi.setMarkers([]);
                return;
            }
            const tMin = allCandles[0].time;
            const tMax = allCandles[allCandles.length - 1].time;
            const markers = [];
            for (const t of overlayTxParsed) {
                if (t.time < tMin || t.time > tMax) continue;
                markers.push({
                    time: snapTime(t.time),
                    price: t.price,
                    position: 'atPriceMiddle',
                    shape: 'circle',
                    color: t.color,
                    size: 0.75,
                });
            }
            // déjà triés via overlayTxParsed ; re-sort au cas où snap regroupe
            markers.sort((a, b) => a.time - b.time || a.price - b.price);
            seriesMarkersApi.setMarkers(markers);
        }

        async function fetchOverlayPayload(stem, id) {
            const q = id ? `?id=${encodeURIComponent(id)}` : '';
            const resp = await fetch(`/api/overlay/${encodeURIComponent(stem)}${q}`);
            if (!resp.ok) return null;
            return resp.json();
        }

        async function applyOverlaySelection() {
            // Calque pur : markers + segments uniquement — pas de reload candles ni jump pan.
            clearOverlayDrawings();
            for (const key of selectedOverlayKeys) {
                if (overlayPayloads.has(key)) continue;
                // Le stem ne peut pas contenir '|' (validé serveur) : 1er séparateur = frontière.
                const sep = key.indexOf('|');
                const stem = sep < 0 ? key : key.slice(0, sep);
                const id = sep < 0 ? undefined : key.slice(sep + 1);
                const payload = await fetchOverlayPayload(stem, id);
                if (payload) overlayPayloads.set(key, payload);
            }
            parseOverlayPayloads();
            applyOverlayMarkers();
            scheduleOverlayCanvasDraw();
        }

        // --- Sélecteur d'overlay : catalogue, filtres, rendu ---

        const OVERLAY_UNIT_MINUTES = { min: 1, hour: 60, day: 1440, week: 10080 };
        const OVERLAY_UNIT_SUFFIX = { min: 'min', hour: 'h', day: 'd', week: 'w' };
        const OVERLAY_FILTERS_KEY = 'myquantstore-overlay-filters';
        let overlayActiveIndex = -1;

        function graphMinutes() {
            return (currentTimescale.nb || 1) * (OVERLAY_UNIT_MINUTES[currentTimescale.unit] || 1);
        }

        function timeframeLabel(tf) {
            if (!tf) return '?';
            return `${tf.nb}${OVERLAY_UNIT_SUFFIX[tf.unit] || tf.unit}`;
        }

        /** `gte` : UT de calcul égale ou plus grossière que le graph — direction non lossy. */
        function overlayMatchesUt(row) {
            const om = row.timeframe ? row.timeframe.minutes : 0;
            const gm = graphMinutes();
            return overlayFilters.ut === 'eq' ? om === gm : om >= gm;
        }

        function overlayHaystack(row) {
            if (row._hay === undefined) {
                const parts = [row.label, row.id, row.stem, row.backtest_type, timeframeLabel(row.timeframe)];
                for (const [k, v] of Object.entries(row.params || {})) parts.push(`${k}=${v}`);
                row._hay = parts.join(' ').toLowerCase();
            }
            return row._hay;
        }

        /** Type, puis tokens de recherche (sous-chaînes, tous requis), puis relation UT. */
        function filterOverlays() {
            const tokens = overlayFilters.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
            const inside = [];
            const outside = [];
            for (const row of (overlayCatalog.overlays || [])) {
                if (overlayFilters.type && row.backtest_type !== overlayFilters.type) continue;
                if (tokens.length) {
                    const hay = overlayHaystack(row);
                    if (!tokens.every((t) => hay.includes(t))) continue;
                }
                (overlayMatchesUt(row) ? inside : outside).push(row);
            }
            return { inside, outside };
        }

        function overlayRowByKey(key) {
            return (overlayCatalog.overlays || []).find((r) => r.key === key) || null;
        }

        function appendDefRow(dl, key, value, salient) {
            const dt = document.createElement('dt');
            dt.textContent = key;
            if (salient) dt.className = 'ov-salient';
            const dd = document.createElement('dd');
            dd.textContent = value;
            dl.append(dt, dd);
        }

        /** Tooltip de survol : liste complète des params, saillants mis en avant. */
        function showOverlayTooltip(row, anchor) {
            const tip = document.getElementById('overlay-tooltip');
            tip.textContent = '';
            const head = document.createElement('div');
            head.className = 'ov-tt-head';
            head.textContent = `${row.backtest_type} — ${row.id}`;
            const dl = document.createElement('dl');
            appendDefRow(dl, 'UT', timeframeLabel(row.timeframe), false);
            appendDefRow(dl, 'instrument', row.instrument, false);
            appendDefRow(dl, 'fichier', row.stem, false);
            const salient = new Set(row.salient || []);
            for (const [k, v] of Object.entries(row.params || {})) {
                appendDefRow(dl, k, String(v), salient.has(k));
            }
            tip.append(head, dl);
            tip.style.display = 'block';
            tip.style.left = '0px';
            tip.style.top = '0px';
            const rect = anchor.getBoundingClientRect();
            const tipRect = tip.getBoundingClientRect();
            let left = rect.right + 10;
            if (left + tipRect.width > window.innerWidth - 8) left = rect.left - tipRect.width - 10;
            let top = rect.top;
            if (top + tipRect.height > window.innerHeight - 8) top = window.innerHeight - tipRect.height - 8;
            tip.style.left = `${Math.max(8, left)}px`;
            tip.style.top = `${Math.max(8, top)}px`;
        }

        function hideOverlayTooltip() {
            document.getElementById('overlay-tooltip').style.display = 'none';
        }

        function buildOverlayItem(row) {
            const item = document.createElement('div');
            item.className = 'ov-item';
            item.setAttribute('role', 'option');
            item.dataset.key = row.key;
            item.setAttribute('aria-selected', selectedOverlayKeys.includes(row.key) ? 'true' : 'false');
            const name = document.createElement('span');
            name.textContent = row.label;
            const id = document.createElement('span');
            id.className = 'ov-id';
            id.textContent = row.id;
            item.append(name, id);
            item.addEventListener('click', () => { selectOverlay(row.key); closeOverlayPopover(); });
            item.addEventListener('mouseenter', () => showOverlayTooltip(row, item));
            item.addEventListener('mouseleave', hideOverlayTooltip);
            return item;
        }

        function appendOverlayGroups(container, rows) {
            const byType = new Map();
            for (const row of rows) {
                if (!byType.has(row.backtest_type)) byType.set(row.backtest_type, []);
                byType.get(row.backtest_type).push(row);
            }
            for (const [type, group] of byType) {
                const head = document.createElement('div');
                head.className = 'ov-group-head';
                head.textContent = `${type} `;
                const count = document.createElement('span');
                count.className = 'ov-count';
                count.textContent = `(${group.length})`;
                head.appendChild(count);
                container.appendChild(head);
                for (const row of group) container.appendChild(buildOverlayItem(row));
            }
        }

        function updateOverlayTrigger() {
            const trigger = document.getElementById('overlay-trigger');
            if (!trigger) return;
            const row = selectedOverlayKeys.length ? overlayRowByKey(selectedOverlayKeys[0]) : null;
            trigger.querySelector('.ov-name').textContent = row ? row.label : 'Aucun';
            trigger.title = row ? `${row.label} — ${row.id}` : 'Aucun overlay sélectionné';
            // Sélection hors filtre : on la signale, on ne retire pas le calque du graph.
            trigger.querySelector('.ov-warn').hidden = !(row && !overlayMatchesUt(row));
        }

        function renderOverlayList() {
            const list = document.getElementById('overlay-list');
            if (!list) return;
            const { inside, outside } = filterOverlays();
            list.textContent = '';

            const none = document.createElement('div');
            none.className = 'ov-item';
            none.setAttribute('role', 'option');
            none.dataset.key = '';
            none.setAttribute('aria-selected', selectedOverlayKeys.length ? 'false' : 'true');
            const noneLabel = document.createElement('span');
            noneLabel.textContent = 'Aucun overlay';
            none.appendChild(noneLabel);
            none.addEventListener('click', () => { selectOverlay(''); closeOverlayPopover(); });
            list.appendChild(none);

            if (inside.length) {
                appendOverlayGroups(list, inside);
            } else {
                const empty = document.createElement('div');
                empty.className = 'ov-empty';
                empty.textContent = 'Aucun backtest ne correspond aux filtres.';
                list.appendChild(empty);
            }

            // Joignabilité : sans cette section, un backtest 1min est inatteignable depuis un graph 5min.
            if (outside.length) {
                const details = document.createElement('details');
                details.className = 'ov-outside';
                const summary = document.createElement('summary');
                summary.textContent = `Hors filtre UT (${outside.length})`;
                details.appendChild(summary);
                const box = document.createElement('div');
                appendOverlayGroups(box, outside);
                details.appendChild(box);
                list.appendChild(details);
            }

            updateOverlayTrigger();
        }

        function renderOverlayTypes() {
            const sel = document.getElementById('overlay-type');
            const types = (overlayCatalog.facets && overlayCatalog.facets.types) || [];
            sel.textContent = '';
            const all = document.createElement('option');
            all.value = '';
            all.textContent = `Tous les types (${(overlayCatalog.overlays || []).length})`;
            sel.appendChild(all);
            for (const t of types) {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = `${t.name} (${t.count})`;
                sel.appendChild(opt);
            }
            if (types.some((t) => t.name === overlayFilters.type)) sel.value = overlayFilters.type;
            else { overlayFilters.type = ''; sel.value = ''; }
        }

        function renderOverlaySkipped() {
            const box = document.getElementById('overlay-skipped');
            const skipped = overlayCatalog.skipped || [];
            box.hidden = !skipped.length;
            if (!skipped.length) return;
            box.textContent = '';
            const head = document.createElement('div');
            head.textContent = `${skipped.length} fichier(s) ignoré(s) — format non v2 :`;
            box.appendChild(head);
            for (const s of skipped.slice(0, 5)) {
                const line = document.createElement('div');
                line.textContent = `• ${s.file} — ${s.reason}`;
                box.appendChild(line);
            }
        }

        function persistOverlayFilters() {
            try {
                localStorage.setItem(OVERLAY_FILTERS_KEY, JSON.stringify({
                    type: overlayFilters.type,
                    ut: overlayFilters.ut,
                    key: selectedOverlayKeys[0] || '',
                }));
            } catch { /* quota / navigation privée : filtres non persistés, sans incidence */ }
        }

        /** Restaure type + relation UT ; renvoie la dernière clé sélectionnée si connue. */
        function restoreOverlayFilters() {
            try {
                const raw = localStorage.getItem(OVERLAY_FILTERS_KEY);
                if (!raw) return null;
                const saved = JSON.parse(raw);
                if (saved && typeof saved === 'object') {
                    if (saved.ut === 'eq' || saved.ut === 'gte') overlayFilters.ut = saved.ut;
                    if (typeof saved.type === 'string') overlayFilters.type = saved.type;
                    return typeof saved.key === 'string' ? saved.key : null;
                }
            } catch { /* entrée corrompue : on repart sur les défauts */ }
            return null;
        }

        function syncOverlayChips() {
            for (const chip of document.querySelectorAll('#overlay-popover .ov-chip')) {
                chip.setAttribute('aria-pressed', chip.dataset.ut === overlayFilters.ut ? 'true' : 'false');
            }
        }

        function overlayVisibleItems() {
            return Array.from(document.querySelectorAll('#overlay-list .ov-item'))
                .filter((el) => el.offsetParent !== null);
        }

        function moveOverlayActive(delta) {
            const items = overlayVisibleItems();
            if (!items.length) return;
            for (const el of items) el.classList.remove('ov-active');
            overlayActiveIndex = (overlayActiveIndex + delta + items.length) % items.length;
            const el = items[overlayActiveIndex];
            el.classList.add('ov-active');
            el.scrollIntoView({ block: 'nearest' });
            const row = el.dataset.key ? overlayRowByKey(el.dataset.key) : null;
            if (row) showOverlayTooltip(row, el); else hideOverlayTooltip();
        }

        function openOverlayPopover() {
            document.getElementById('overlay-popover').hidden = false;
            document.getElementById('overlay-trigger').setAttribute('aria-expanded', 'true');
            renderOverlayList();
            const search = document.getElementById('overlay-search');
            search.value = overlayFilters.search;
            search.focus();
            search.select();
        }

        function closeOverlayPopover() {
            document.getElementById('overlay-popover').hidden = true;
            document.getElementById('overlay-trigger').setAttribute('aria-expanded', 'false');
            hideOverlayTooltip();
            overlayActiveIndex = -1;
        }

        async function selectOverlay(key) {
            selectedOverlayKeys = key ? [key] : [];
            persistOverlayFilters();
            await applyOverlaySelection();
            renderOverlayList();
        }

        function wireOverlayPicker() {
            const trigger = document.getElementById('overlay-trigger');
            const search = document.getElementById('overlay-search');
            const typeSel = document.getElementById('overlay-type');

            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (document.getElementById('overlay-popover').hidden) openOverlayPopover();
                else closeOverlayPopover();
            });
            search.addEventListener('input', () => {
                overlayFilters.search = search.value;
                overlayActiveIndex = -1;
                renderOverlayList();
            });
            search.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown') { e.preventDefault(); moveOverlayActive(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); moveOverlayActive(-1); }
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    const items = overlayVisibleItems();
                    const el = items[overlayActiveIndex] || items[0];
                    if (el) { selectOverlay(el.dataset.key); closeOverlayPopover(); }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeOverlayPopover();
                    trigger.focus();
                }
            });
            typeSel.addEventListener('change', () => {
                overlayFilters.type = typeSel.value;
                overlayActiveIndex = -1;
                persistOverlayFilters();
                renderOverlayList();
            });
            for (const chip of document.querySelectorAll('#overlay-popover .ov-chip')) {
                chip.addEventListener('click', () => {
                    overlayFilters.ut = chip.dataset.ut;
                    overlayActiveIndex = -1;
                    syncOverlayChips();
                    persistOverlayFilters();
                    renderOverlayList();
                });
            }
            document.addEventListener('click', (e) => {
                const picker = document.getElementById('overlay-picker');
                if (!picker.hidden && !picker.contains(e.target)) closeOverlayPopover();
            });
        }

        async function initOverlays() {
            const empty = { overlays: [], facets: { types: [] }, skipped: [] };
            try {
                const resp = await fetch(`/api/overlays?product=${encodeURIComponent(PRODUCT)}`);
                overlayCatalog = resp.ok ? await resp.json() : empty;
            } catch {
                overlayCatalog = empty;
            }
            const rows = overlayCatalog.overlays || [];
            if (!rows.length && !(overlayCatalog.skipped || []).length) return;
            document.getElementById('overlay-picker').hidden = false;

            const savedKey = restoreOverlayFilters();
            renderOverlayTypes();
            syncOverlayChips();
            renderOverlaySkipped();
            wireOverlayPicker();

            // Priorité : deep-link ?overlay=&id=, puis dernière sélection, puis 1er match du filtre.
            const params = new URLSearchParams(location.search);
            const wantStem = params.get('overlay');
            const wantId = params.get('id');
            let initial = '';
            if (wantStem) {
                const hit = rows.find((r) => r.stem === wantStem && (!wantId || r.id === wantId));
                if (hit) initial = hit.key;
            }
            if (!initial && savedKey && rows.some((r) => r.key === savedKey)) initial = savedKey;
            if (!initial) {
                const { inside } = filterOverlays();
                if (inside.length) initial = inside[0].key;
            }

            selectedOverlayKeys = initial ? [initial] : [];
            await applyOverlaySelection();
            renderOverlayList();
        }

        // --- Logger minimal ---
        const logger = { debug: (...args) => console.log('[chart]', ...args) };

        // --- Initialisation ---
        createChart();

        // Restaurer l'échelle Lin/Log (défaut: linéaire)
        const savedScale = localStorage.getItem('myquantstore-price-scale');
        if (savedScale === 'log' || savedScale === 'linear') {
            document.getElementById('scale-select').value = savedScale;
            applyPriceScaleMode(savedScale);
        }

        // Restaurer l'UT sauvegardée dans localStorage (survit aux F5)
        const savedTimescale = localStorage.getItem('myquantstore-timescale');
        if (savedTimescale) {
            const [u, n] = savedTimescale.split(':');
            currentTimescale = { unit: u, nb: parseInt(n) };
            document.getElementById('timescale-select').value = savedTimescale;
        }

        loadInitial().then(() => initOverlays());
    </script>
</body>
</html>
